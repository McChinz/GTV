name: Build City Sandbox VPK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITASDK: /home/runner/vitasdk
    steps:
      - uses: actions/checkout@v4

      - name: Install VitaSDK + all vdpm packages (includes vitaGL)
        run: |
          git clone --depth 1 https://github.com/vitasdk/vdpm
          cd vdpm
          ./bootstrap-vitasdk.sh
          ./install-all.sh
          echo "$VITASDK/bin" >> "$GITHUB_PATH"

      - name: Unpack project zip from repo root
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then echo "::error::No .zip found in the repo root"; exit 1; fi
          echo "Using $ZIP"
          rm -rf project && mkdir project
          unzip -q -o "$ZIP" -d project
          CML=$(find project -name CMakeLists.txt -not -path '*/__MACOSX/*' | awk '{ print length, $0 }' | sort -n | head -n 1 | cut -d' ' -f2-)
          if [ -z "$CML" ]; then echo "::error::No CMakeLists.txt inside the zip"; exit 1; fi
          echo "SRC=$(dirname "$CML")" >> "$GITHUB_ENV"

      - name: Build VPK
        run: |
          # vita-elf-create can fail with "Cannot allocate ... SCE data at end of segment 0"
          # when the code segment ends too close to the data segment. Retry with padding.
          for PAD in 16 4096 8192 12288 16384 20480 24576 28672 32768 36864 40960 45056 49152 53248 57344 61440; do
            rm -rf build
            if cmake -S "$SRC" -B build -DCMAKE_BUILD_TYPE=Release -DELF_PAD=$PAD && cmake --build build -j"$(nproc)"; then
              echo "Built with ELF_PAD=$PAD"
              break
            fi
            echo "Build failed with ELF_PAD=$PAD, retrying with more padding"
          done
          ls -la build/*.vpk

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: CitySandbox-vpk
          path: build/*.vpk
